# x11-ssh-askpass cannot grab the keyboard under Wayland; FIDO2 PIN prompts from gcr-ssh-agent need a GTK askpass.
SSH_ASKPASS=/usr/libexec/seahorse/ssh-askpass
# gcr-ssh-agent can start before GNOME exports WAYLAND_DISPLAY; ssh-agent then skips askpass and sends an empty PIN.
# shortcut: hard-coded GNOME socket name, set it per session if a second Wayland session ever runs.
WAYLAND_DISPLAY=wayland-0
