# Public SSH client defaults, versioned in dotfiles.
# ~/.ssh/config (private, unversioned) keeps the host inventory and ends with:
#   Match all
#   Include ~/.config/ssh/common.conf
# ssh keeps the first value it reads, so the private host blocks override these.

Host github.com
  UpdateHostKeys yes
  User git
  PreferredAuthentications publickey
  # One PIN + touch per workday; any local process can push while the master is open (ssh -O exit github.com).
  ControlPersist 8h
  # Keep the idle master alive through NAT/WARP timeouts.
  ServerAliveInterval 60

Host *
  IdentitiesOnly yes
  IgnoreUnknown AddKeysToAgent,UseKeychain
  AddKeysToAgent yes
  # gcr-ssh-agent republishes ~/.ssh/*.pub but fails to sign with the YubiKey keys ("invalid format"),
  # so every login asked twice. ssh signs itself: one PIN + touch per master (git signs with gpg-agent).
  IdentityAgent none
  UseKeychain yes
  # A root user on the remote host could use the forwarded agent.
  ForwardAgent no
  ControlMaster auto
  ControlPath ~/.ssh/cm-%r@%h:%p
  ControlPersist 10m

# Workstation (local short hostname "albandrieu"): YubiKeys first, id_ed25519_sk before
# id_ed25519_sk_principale. A key absent from the plugged YubiKey still costs a PIN, so the usual one goes first.
Match exec "test %L = albandrieu"
  IdentityFile ~/.ssh/id_ed25519_sk
  IdentityFile ~/.ssh/id_ed25519_sk_principale

# Workstation: file key for servers only, on GitHub it would sign without PIN.
# Break-glass push (no config, no shared master, file key only):
#   GIT_SSH_COMMAND="ssh -F /dev/null -o ControlPath=none -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519" git push
Match host "*,!github.com" exec "test %L = albandrieu"
  IdentityFile ~/.ssh/id_ed25519

# Other machines (no YubiKey): file key everywhere, GitHub included.
Match !exec "test %L = albandrieu"
  IdentityFile ~/.ssh/id_ed25519
