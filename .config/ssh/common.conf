# Public SSH client defaults, versioned in dotfiles.
# ~/.ssh/config (private, unversioned) keeps the host inventory and ends with:
#   Match all
#   Include ~/.config/ssh/common.conf
# ssh keeps the first value it reads, so the private host blocks override these.

Host github.com
  UpdateHostKeys yes
  User git
  PreferredAuthentications publickey
  # One PIN + touch per workday; any local process can push while the master is open (ssh -O exit github.com).
  ControlPersist 8h
  # Keep the idle master alive through NAT/WARP timeouts.
  ServerAliveInterval 60

Host *
  IdentitiesOnly yes
  IgnoreUnknown AddKeysToAgent,UseKeychain
  AddKeysToAgent yes
  UseKeychain yes
  # A root user on the remote host could use the forwarded agent.
  ForwardAgent no
  ControlMaster auto
  ControlPath ~/.ssh/cm-%r@%h:%p
  ControlPersist 10m
  # YubiKeys first (main, then backup: an absent key is skipped).
  IdentityFile ~/.ssh/id_ed25519_sk_principale
  IdentityFile ~/.ssh/id_ed25519_sk

# File key for servers only: on GitHub it would sign without PIN whenever the backup YubiKey is absent.
# Break-glass push (no config, no shared master, file key only):
#   GIT_SSH_COMMAND="ssh -F /dev/null -o ControlPath=none -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519" git push
Match host "*,!github.com"
  IdentityFile ~/.ssh/id_ed25519
