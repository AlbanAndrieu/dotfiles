# Public SSH client defaults, versioned in dotfiles.
# ~/.ssh/config (private, unversioned) keeps the host inventory and ends with:
#   Match all
#   Include ~/.config/ssh/common.conf
# ssh keeps the first value it reads, so the private host blocks override these.

Host github.com
  UpdateHostKeys yes
  User git
  PreferredAuthentications publickey
  # One PIN + touch per workday; any local process can push while the master is open (ssh -O exit github.com).
  ControlPersist 8h
  # Keep the idle master alive through NAT/WARP timeouts.
  ServerAliveInterval 60

Host *
  IdentitiesOnly yes
  IgnoreUnknown AddKeysToAgent,UseKeychain
  AddKeysToAgent yes
  UseKeychain yes
  # A root user on the remote host could use the forwarded agent.
  ForwardAgent no
  ControlMaster auto
  ControlPath ~/.ssh/cm-%r@%h:%p
  ControlPersist 10m
  # YubiKey first; the file key stays as fallback until every host knows the YubiKey.
  IdentityFile ~/.ssh/id_ed25519_sk
  IdentityFile ~/.ssh/id_ed25519
