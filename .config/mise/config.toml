[tools]
# terraform = "1.14.0"
# aws-cli = "2"
# ruby = "3.4.7"
# ruby = "3.1.5"
# node = "lts"
node = "26.9.0"
go = "1.25.5"
sops = "latest"
age = "latest"
# Only install on Linux and macOS
ripgrep = { version = "latest", os = ["linux", "macos"] }
fnox = "latest"
pre-commit = "latest"
popeye = "latest"
kustomize = "latest"
krew = "latest"
"github:getplumber/plumber" = "latest"
python = "3.14"
"pipx:yamllint" = "latest"
opencode = "latest"
bitwarden = "latest"
just = "1.58.0"
# .NET SDK only on macOS (skipped on Ubuntu)
dotnet = { version = "latest", os = ["macos"] }
gh = "2.101.0"
npm = "12.2.0"
pipx = "1.17.6"
uv = "latest"
# Shell prompt (config: ~/.config/starship.toml)
starship = "latest"
# Security scanners: secrets, dependency vulns, GitHub Actions
betterleaks = "latest"
osv-scanner = "latest"
zizmor = "latest"
gitleaks = "latest"
ggshield = "latest"
terrascan = "latest"
hadolint = "latest"
# Dev tooling (moved from Brewfile)
dive = "latest"
fzf = "latest"
# Modern ls (maintained fork of exa), used by ll/la/l in ~/.aliases
eza = "latest"
# cat with syntax highlighting (Ubuntu apt package names it batcat)
bat = "latest"
github-markdown-toc = "latest"
# git pager (core.pager in ~/.gitconfig)
delta = "latest"
azure-cli = "latest"
shellcheck = "0.11.0"
direnv = "2.38.2"
kubeconform = "0.6.7"
# Go-based command-line wrapper for Datadog APIs (moved from Brewfile), macOS only
"github:datadog-labs/pup" = { version = "latest", os = ["macos"] }

[env]
# _.file = { path = "$HOME/.env.secrets", redact = true }
_.file = { path = "$HOME/.env.secrets.yaml", redact = true }
# SONAR_TOKEN = "{{ env.SONARCLOUD_TOKEN }}"

# TF_WORKSPACE = "development"
AWS_REGION = "us-east-1"
# AWS_PROFILE = "dev"
AWS_PROFILE = "eks"

[tasks.plan]
description = "Run terraform plan with configured workspace"
run = """
terraform init -reconfigure -upgrade
# terraform workspace select $TF_WORKSPACE
terraform plan -parallelism=2 -lock=true
"""

[tasks.validate]
description = "Validate AWS credentials and terraform config"
run = """
aws sts get-caller-identity
terraform validate
"""

[tasks.deploy]
description = "Deploy infrastructure after validation"
depends = ["validate", "plan"]
run = "terraform apply -lock=true"

# Home secrets (sops + age), see ~/run-sops-encrypt.sh:
#   env  : ~/.env.secrets.yaml only (loaded by [env] above), edited with secrets:edit env
#   kube : ~/.kube/config <-> ~/.kube/config.sops.yaml (versioned)
[tasks."secrets:edit"]
description = "✏️  Edit an encrypted home secret in $EDITOR (env or kube)"
usage = 'arg "<target>" help="env or kube"'
# Interactive: the editor needs the terminal (stdin/stdout not piped by mise)
raw = true
run = '"$HOME/run-sops-encrypt.sh" edit "${usage_target}"'

[tasks."secrets:encrypt"]
description = "🔐 Encrypt the home secrets (env, kube or all)"
usage = 'arg "[target]" default="all" help="env, kube or all"'
run = '"$HOME/run-sops-encrypt.sh" encrypt "${usage_target:-all}"'

[tasks."secrets:decrypt"]
description = "🔓 Decrypt the home secrets (env, kube or all), previous files kept as .bak"
usage = 'arg "[target]" default="all" help="env, kube or all"'
run = '"$HOME/run-sops-encrypt.sh" decrypt "${usage_target:-all}"'

[tasks."secrets:status"]
description = "🔎 Show whether the home secrets are present, encrypted and in sync"
usage = 'arg "[target]" default="all" help="env, kube or all"'
run = '"$HOME/run-sops-encrypt.sh" status "${usage_target:-all}"'

[tasks."kube:encrypt"]
description = "🔐 Encrypt ~/.kube/config into ~/.kube/config.sops.yaml"
run = '"$HOME/run-sops-encrypt.sh" encrypt kube'

[tasks."kube:decrypt"]
description = "🔓 Decrypt ~/.kube/config.sops.yaml into ~/.kube/config"
run = '"$HOME/run-sops-encrypt.sh" decrypt kube'

[settings]
lockfile = true
experimental = true
auto_update = true
sops.rops = false
